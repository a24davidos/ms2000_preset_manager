<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>MS2000</title>
</head>
<body>
    <header>
        <div class="header__brand">
            <span>Korg</span>
            <span>Preset Manager</span>
        </div>
        <div class="header__status">
            <span>Disquete</span>
            <span>Korg ms2000</span>
        </div>
    </header>
    <main class="explorador">
        <section class="panel panel--sintetizador">
            <div class="panel__header">
                <h4>Sintetizador</h4>
                <div class="panel__menu">
                    <div class="panel__toolbar panel__toolbar--banks">
                        <button>A</button>
                        <button>B</button>
                        <button>C</button>
                        <button>D</button>
                        <button>E</button>
                        <button>F</button>
                        <button>G</button>
                        <button>H</button>
                    </div>
                    <div class="panel__toolbar panel__toolbar--io">
                        <button>⤓</button>
                        <button>⤒</button>
                    </div>
                </div>
            </div>
        </section>
        <section class="panel panel--explorador">
            <div class="panel__header">
                <h4>Explorador</h4>
                <div class="panel__menu">
                    <button class="panel__path">/Users/usuario/Documentos/MS2000 Backups/factory_sysex.syx</button>
                </div>
            </div>
        </section>
    </main>

</html>
